nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        # The RealWorld spec sends the JWT in the `Authorization` header using
        # the `Token` scheme; `Token` is also accepted as a standalone header.
        allow_headers: ['Content-Type', 'Authorization', 'Token']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/api/': null
